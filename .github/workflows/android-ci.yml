name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests (retry transient Maven Central failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Unit test attempt ${attempt}/3"
            if gradle --no-configuration-cache testDebugUnitTest; then
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Gradle test task failed; waiting ${delay}s before retry."
              sleep "${delay}"
            fi
          done

          echo "Unit tests failed after 3 attempts."
          exit 1

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare Android Debug Signing Key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_DEBUG_KEYSTORE_BASE64}" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          test -s debug.keystore

      - name: Build Debug APK
        run: gradle --no-configuration-cache assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-ledger-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
